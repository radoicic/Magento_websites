<div class="header-main">
	<div class="container">

		<div class="header-main-left">
			<div class="search-area">
				<div class="block block-search">
					<div class="block block-content">
						<form class="form minisearch" id="search_mini_form" action="https://www.nzboxer.com/catalogsearch/result/" method="get">
							<div class="field search">
								<div class="control">
									<input id="search" type="text" name="q" value="" placeholder="Search..." class="input-text" maxlength="40" role="combobox" aria-haspopup="false" aria-autocomplete="both" autocomplete="off">
									<div id="search_autocomplete" class="search-autocomplete"></div>
								</div>
							</div>
							<div class="actions">
								<button type="submit" title="Search" class="action search" disabled="">
									<span>Search</span>
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>

		<div class="header-main-center">
			<strong class="logo">
				<img src="assets/img/Logo_1.jpg" alt="NZ Boxer Logo" width="170" height="64">
			</strong>
		</div>

		<div class="header-main-right">
			<div class="header-contact">

			</div>
			<div class="minicart-wrapper">

				<a class="action showcart" href="https://www.nzboxer.com/checkout/cart/">
					<i class="minicart-icon"></i>
					<span class="counter qty"><span class="counter-number">0</span></span>
				</a>

				<div class="minicart-dropdown">
					<div class="block-minicart">
						<div id="minicart-content-wrapper">
							<div class="mcw-header">
								<div class="items-total">
									<span class="count">0</span>
									<span class="counter-label">Item</span>
								</div>
								<div class="actions">
									<a class="action viewcart" href="https://www.nzboxer.com/checkout/cart/">
										<span>View Cart</span>
									</a>
								</div>
							</div>
							<!-- cart değişken alan -->
						</div>
					</div>
				</div>

			</div>
		</div>

	</div>
</div>
